databases:
  - name: ai-prospecting-db
    plan: free

services:
  - type: web
    name: ai-prospecting-api
    runtime: docker
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-prospecting-db
          property: connectionString
      - key: LLM_PROVIDER
        value: stub
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: DISCOVERY_PROVIDER
        value: csv
      - key: CORS_ORIGINS
        sync: false
      - key: OPENAI_API_KEY
        sync: false
